<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도서 썸네일 만들기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f0f0ed; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .container { width: 100%; max-width: 680px; background: #fff; border-radius: 16px; border: 1px solid #e0e0e0; padding: 28px; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 20px; color: #111; }
  .panel { background: #f7f7f7; border: 0.5px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .panel label.section { font-size: 12px; color: #888; display: block; margin-bottom: 10px; }
  .upload-area { border: 1px dashed #ccc; border-radius: 8px; padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
  .upload-area:hover { border-color: #888; }
  .upload-area p { font-size: 13px; color: #aaa; margin-top: 8px; }
  .upload-area.has-file p { color: #555; }
  input[type=file] { display: none; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  input[type=number] { background: #fff; border: 0.5px solid #ccc; border-radius: 6px; color: #111; font-size: 13px; padding: 6px 8px; width: 90px; text-align: center; outline: none; }
  input[type=number]:focus { border-color: #888; }
  input[type=range] { flex: 1; accent-color: #333; }
  .range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .range-row:last-child { margin-bottom: 0; }
  .range-row span.lbl { font-size: 12px; color: #888; width: 90px; flex-shrink: 0; }
  .range-row span.val { font-size: 12px; color: #555; width: 36px; text-align: right; flex-shrink: 0; }
  .preview-wrap { background: #f0f0f0; border-radius: 10px; padding: 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; min-height: 160px; }
  canvas { max-width: 100%; max-height: 300px; display: block; }
  #placeholder { font-size: 13px; color: #aaa; }
  .dl-btn { width: 100%; background: #111; color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .dl-btn:hover { background: #333; }
  .dl-btn:disabled { background: #ddd; color: #aaa; cursor: not-allowed; }
  .sep { color: #aaa; font-size: 13px; }
  .info { font-size: 11px; color: #aaa; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>도서 썸네일 만들기</h1>

  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:14px;">
    <div class="panel" style="margin-bottom:0;">
      <label class="section">① 마스크 이미지 업로드</label>
      <div class="upload-area" id="maskUploadArea" onclick="document.getElementById('maskInput').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/></svg>
        <p id="maskUploadText">클릭하거나 드래그</p>
      </div>
      <input type="file" id="maskInput" accept="image/*">
    </div>

    <div class="panel" style="margin-bottom:0;">
      <label class="section">② 표지 이미지 업로드</label>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('imgInput').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <p id="uploadText">클릭하거나 드래그</p>
      </div>
      <input type="file" id="imgInput" accept="image/*">
    </div>

    <div class="panel" style="margin-bottom:0;">
      <label class="section">③ 효과 이미지 업로드</label>
      <div class="upload-area" id="effectUploadArea" onclick="document.getElementById('effectInput').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
        <p id="effectUploadText">클릭하거나 드래그</p>
      </div>
      <input type="file" id="effectInput" accept="image/*">
    </div>
  </div>

  <div id="previewSection" style="display:none; margin-bottom:14px;">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start;">
      <div class="preview-wrap" style="margin-bottom:0;">
        <canvas id="previewCanvas"></canvas>
      </div>

      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="panel" style="margin-bottom:0;">
          <label class="section">캔버스 크기</label>
          <div class="row">
            <input type="number" id="canvasW" value="305" min="100" max="4000" aria-label="너비">
            <span class="sep">×</span>
            <input type="number" id="canvasH" value="405" min="100" max="4000" aria-label="높이">
            <span style="font-size:12px;color:#666;">px</span>
          </div>
          <p class="info" id="canvasSizeInfo">* 마스크 업로드 시 자동으로 설정됩니다</p>
        </div>

        <div class="panel" style="margin-bottom:0;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <label class="section" style="margin-bottom:0;">이미지 조절</label>
            <div style="display:flex; align-items:center; gap:12px;">
              <label style="display:flex; align-items:center; gap:5px; font-size:12px; color:#888; cursor:pointer;">
                <input type="checkbox" id="lockRatio" checked> 비율 고정
              </label>
              <button onclick="resetControls()" style="font-size:11px; padding:3px 10px; color:#888; border-color:#ddd;">초기화</button>
            </div>
          </div>
          <div class="range-row">
            <span class="lbl">수평 위치</span>
            <input type="range" id="imgX" min="0" max="100" value="50" oninput="updateVal('xVal',this.value);renderPreview()">
            <span class="val" id="xVal">50</span>
          </div>
          <div class="range-row">
            <span class="lbl">수직 위치</span>
            <input type="range" id="imgY" min="0" max="100" value="50" oninput="updateVal('yVal',this.value);renderPreview()">
            <span class="val" id="yVal">50</span>
          </div>
          <div class="range-row">
            <span class="lbl">줌</span>
            <input type="range" id="imgZoom" min="50" max="200" value="100" oninput="updateVal('zoomVal',this.value);renderPreview()">
            <span class="val" id="zoomVal">100</span>
          </div>
          <div class="range-row">
            <span class="lbl">가로 비율</span>
            <input type="range" id="imgScaleX" min="50" max="150" value="100">
            <span class="val" id="scaleXVal">100</span>
          </div>
          <div class="range-row">
            <span class="lbl">세로 비율</span>
            <input type="range" id="imgScaleY" min="50" max="150" value="100">
            <span class="val" id="scaleYVal">100</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
    <input type="text" id="fileName" value="thumbnail_masked" placeholder="파일명 입력"
      style="flex:1; background:#f7f7f7; border:0.5px solid #ddd; border-radius:8px; padding:9px 12px; font-size:13px; color:#111; outline:none;">
    <span style="font-size:13px; color:#aaa;">.png</span>
  </div>

  <button class="dl-btn" id="downloadBtn" onclick="downloadPNG()" disabled>PNG 다운로드</button>
</div>

let imgObj = null;
let maskReady = false;
let effectObj = null;

const maskImg = new Image();
maskImg.onerror = function() { console.error('마스크 이미지 로딩 실패'); };

function updateVal(id, val) {
  document.getElementById(id).textContent = val;
}

document.getElementById('imgInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  loadImageFile(file);
});

document.getElementById('maskInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  loadMaskFile(file);
});

document.getElementById('effectInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  loadEffectFile(file);
});

function addDragDrop(areaId, onFile) {
  const area = document.getElementById(areaId);
  area.addEventListener('dragover', function(e) {
    e.preventDefault();
    area.style.borderColor = '#555';
    area.style.background = '#f0f0f0';
  });
  area.addEventListener('dragleave', function() {
    area.style.borderColor = '';
    area.style.background = '';
  });
  area.addEventListener('drop', function(e) {
    e.preventDefault();
    area.style.borderColor = '';
    area.style.background = '';
    const file = e.dataTransfer.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    onFile(file);
  });
}
addDragDrop('uploadArea', loadImageFile);
addDragDrop('maskUploadArea', loadMaskFile);
addDragDrop('effectUploadArea', loadEffectFile);

function loadMaskFile(file) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      maskImg.onload = function() { maskReady = true; renderPreview(); };
      maskImg.src = img.src;
      document.getElementById('maskUploadText').textContent = file.name;
      document.getElementById('maskUploadArea').classList.add('has-file');
      document.getElementById('canvasW').value = img.width;
      document.getElementById('canvasH').value = img.height;
      document.getElementById('canvasSizeInfo').textContent = '* 마스크 크기: ' + img.width + ' × ' + img.height + ' px';
      document.getElementById('previewSection').style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function loadImageFile(file) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      imgObj = img;
      document.getElementById('uploadText').textContent = file.name;
      document.getElementById('uploadArea').classList.add('has-file');
      document.getElementById('downloadBtn').disabled = false;

      // 캔버스 세로에 꽉 차도록 줌값 자동 계산
      const cw = parseInt(document.getElementById('canvasW').value) || 305;
      const ch = parseInt(document.getElementById('canvasH').value) || 405;
      const imgAspect = img.width / img.height;
      const canvasAspect = cw / ch;
      let autoZoom;
      if (imgAspect > canvasAspect) {
        // 이미지가 더 넓음 → 기본적으로 세로 기준으로 맞춰짐 → zoom 100
        autoZoom = 100;
      } else {
        // 이미지가 더 좁음 → 가로 기준으로 맞춰지므로, 세로 기준으로 맞추려면 zoom 조절
        autoZoom = Math.round(imgAspect / canvasAspect * 100);
      }
      autoZoom = Math.max(50, Math.min(200, autoZoom));
      document.getElementById('imgX').value = 0; updateVal('xVal', 0);
      document.getElementById('imgY').value = 0; updateVal('yVal', 0);
      document.getElementById('imgZoom').value = autoZoom; updateVal('zoomVal', autoZoom);

      renderPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function loadEffectFile(file) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      effectObj = img;
      document.getElementById('effectUploadText').textContent = file.name;
      document.getElementById('effectUploadArea').classList.add('has-file');
      renderPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function resetControls() {
  document.getElementById('imgX').value = 50; updateVal('xVal', 50);
  document.getElementById('imgY').value = 50; updateVal('yVal', 50);
  document.getElementById('imgZoom').value = 100; updateVal('zoomVal', 100);
  document.getElementById('imgScaleX').value = 100; updateVal('scaleXVal', 100);
  document.getElementById('imgScaleY').value = 100; updateVal('scaleYVal', 100);
  renderPreview();
}

document.getElementById('imgScaleX').addEventListener('input', function() {
  if (document.getElementById('lockRatio').checked) {
    document.getElementById('imgScaleY').value = this.value;
    updateVal('scaleYVal', this.value);
  }
  updateVal('scaleXVal', this.value);
  renderPreview();
});

document.getElementById('imgScaleY').addEventListener('input', function() {
  if (document.getElementById('lockRatio').checked) {
    document.getElementById('imgScaleX').value = this.value;
    updateVal('scaleXVal', this.value);
  }
  updateVal('scaleYVal', this.value);
  renderPreview();
});

['canvasW','canvasH'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderPreview);
});

function getParams() {
  const cw = parseInt(document.getElementById('canvasW').value) || 305;
  const ch = parseInt(document.getElementById('canvasH').value) || 405;
  const xP = parseInt(document.getElementById('imgX').value) / 100;
  const yP = parseInt(document.getElementById('imgY').value) / 100;
  const zoom = parseInt(document.getElementById('imgZoom').value) / 100;
  const scaleX = parseInt(document.getElementById('imgScaleX').value) / 100;
  const scaleY = parseInt(document.getElementById('imgScaleY').value) / 100;
  return { cw, ch, xP, yP, zoom, scaleX, scaleY };
}




function drawToCanvas(canvas) {
  if (!maskReady) return;
  const { cw, ch, xP, yP, zoom, scaleX, scaleY } = getParams();
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, cw, ch);

  // ── 레이어 1 (맨 아래): 마스크를 클리핑 패스로 적용 ──
  // 마스크의 흰 영역만 보이도록 알파 마스크 생성
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = cw; maskCanvas.height = ch;
  const maskCtx = maskCanvas.getContext('2d');
  maskCtx.drawImage(maskImg, 0, 0, cw, ch);
  const maskData = maskCtx.getImageData(0, 0, cw, ch);
  // 마스크 알파맵 생성 (밝기 → 알파)
  const alphaMap = new Float32Array(cw * ch);
  for (let i = 0; i < maskData.data.length; i += 4) {
    alphaMap[i / 4] = (maskData.data[i] * 0.299 + maskData.data[i+1] * 0.587 + maskData.data[i+2] * 0.114) / 255;
  }

  // ── 레이어 2 (중간): 표지 이미지를 캔버스에 그림 ──
  if (imgObj) {
    const imgAspect = imgObj.width / imgObj.height;
    const canvasAspect = cw / ch;
    let baseW, baseH;
    if (imgAspect > canvasAspect) {
      baseH = ch * zoom; baseW = baseH * imgAspect;
    } else {
      baseW = cw * zoom; baseH = baseW / imgAspect;
    }
    const scaledW = baseW * scaleX;
    const scaledH = baseH * scaleY;

    // 이미지가 캔버스보다 크면 삐져나온 부분을 xP/yP로 이동
    // 이미지가 캔버스보다 작으면 xP/yP로 위치 지정 (0=왼쪽, 0.5=중앙, 1=오른쪽)
    const offX = scaledW >= cw
      ? -(scaledW - cw) * xP
      : (cw - scaledW) * xP;
    const offY = scaledH >= ch
      ? -(scaledH - ch) * yP
      : (ch - scaledH) * yP;

    ctx.drawImage(imgObj, offX, offY, scaledW, scaledH);
  }

  // 마스크 알파 적용 (표지에 마스크 씌우기)
  const imgData = ctx.getImageData(0, 0, cw, ch);
  for (let i = 0; i < imgData.data.length; i += 4) {
    imgData.data[i+3] = Math.round(imgData.data[i+3] * alphaMap[i / 4]);
  }
  ctx.putImageData(imgData, 0, 0);

  // ── 레이어 3 (맨 위): 효과 이미지를 source-over로 얹기 ──
  if (effectObj) {
    ctx.drawImage(effectObj, 0, 0, cw, ch);
  }
}

function renderPreview() {
  if (!maskReady) return;
  const { cw, ch } = getParams();
  const pc = document.getElementById('previewCanvas');
  const maxW = pc.parentElement.clientWidth - 32;
  const maxH = 340;
  const scale = Math.min(maxW / cw, maxH / ch, 1);
  const dispW = Math.round(cw * scale);
  const dispH = Math.round(ch * scale);

  pc.width = dispW;
  pc.height = dispH;
  const pCtx = pc.getContext('2d');
  pCtx.clearRect(0, 0, dispW, dispH);

  if (imgObj) {
    // 이미지 있으면 마스크 적용 후 표시
    const full = document.createElement('canvas');
    drawToCanvas(full);
    // 체크보드 배경 (투명 영역)
    const tileSize = 10;
    for (let y = 0; y < dispH; y += tileSize) {
      for (let x = 0; x < dispW; x += tileSize) {
        pCtx.fillStyle = ((Math.floor(x/tileSize) + Math.floor(y/tileSize)) % 2 === 0) ? '#e0e0e0' : '#f5f5f5';
        pCtx.fillRect(x, y, tileSize, tileSize);
      }
    }
    pCtx.drawImage(full, 0, 0, dispW, dispH);
  } else {
    // 이미지 없으면 마스크 모양만 회색으로 표시
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = cw;
    tmpCanvas.height = ch;
    const tmpCtx = tmpCanvas.getContext('2d');

    // 마스크 밝기 기반으로 회색 채우기
    tmpCtx.drawImage(maskImg, 0, 0, cw, ch);
    const maskData = tmpCtx.getImageData(0, 0, cw, ch);
    const outData = tmpCtx.createImageData(cw, ch);
    for (let i = 0; i < maskData.data.length; i += 4) {
      const lum = maskData.data[i] * 0.299 + maskData.data[i+1] * 0.587 + maskData.data[i+2] * 0.114;
      outData.data[i]   = 220;
      outData.data[i+1] = 220;
      outData.data[i+2] = 220;
      outData.data[i+3] = Math.round(lum);
    }
    tmpCtx.putImageData(outData, 0, 0);

    // 체크보드
    const tileSize = 10;
    for (let y = 0; y < dispH; y += tileSize) {
      for (let x = 0; x < dispW; x += tileSize) {
        pCtx.fillStyle = ((Math.floor(x/tileSize) + Math.floor(y/tileSize)) % 2 === 0) ? '#e0e0e0' : '#f5f5f5';
        pCtx.fillRect(x, y, tileSize, tileSize);
      }
    }
    pCtx.drawImage(tmpCanvas, 0, 0, dispW, dispH);

    // 안내 텍스트
    pCtx.fillStyle = 'rgba(100,100,100,0.7)';
    pCtx.font = `${Math.round(dispH * 0.045)}px sans-serif`;
    pCtx.textAlign = 'center';
    pCtx.textBaseline = 'middle';
    pCtx.fillText('이미지를 업로드하세요', dispW / 2, dispH / 2);
  }
}

function downloadPNG() {
  if (!imgObj) return;
  const fileName = (document.getElementById('fileName').value.trim() || 'thumbnail_masked') + '.png';
  const full = document.createElement('canvas');
  drawToCanvas(full);
  full.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}
</script>
